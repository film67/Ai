name: Проверка ссылок

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Проверить ссылки и пути к изображениям
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --include-fragments
            --fallback-extensions html
            --remap '^(file://[^#]*/[^./#]*)#(.*)$ $1/index.html#$2'
            --exclude 'https://thinklikeai\.net'
            index.html
            course-vibe-coding.html
            course-automation.html
            course-marketing.html
            ai-consulting.html
            offer.html
            privacy.html
            apply/index.html
          fail: true
